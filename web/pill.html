<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#171320}
html,body{overflow:hidden}
:root{--vio:#6C55E8;--vio2:#9C86F6;--vio3:#C6B4FF;--ink:#F7F4EC;--red:#D0453E;
/* warm plum-black: the brief says warm, not cool violet */
--slab-hi:#2E2530;--slab-mid:#201A1F;--slab-lo:#17130F;
/* pre-mixed rim colours: opaque so wallpaper cannot tint them */
--edge-hi:#6B5F57;--edge-lo:#2E2729;
/* light theme panel tokens */
--lt-bg:#F5EFE2;--lt-surface:#FFFDF7;--lt-text:#231E17;--lt-text2:#665D4C;
--lt-muted:#756B57;--lt-border:#E5DAC4;--lt-accent:#6C55E8;--lt-accent-text:#5240C9;
/* live mic level, 0..1, written every frame by the raf loop while recording */
--lv:0}
/* ==== THE OBJECT ========================================================
   One slab of dark plum glass PINNED FLUSH to the docked screen edge */
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
height:100vh;position:relative;cursor:default;-webkit-user-select:none;user-select:none;
background:radial-gradient(135% 190% at 50% -35%,var(--slab-hi) 0%,var(--slab-mid) 44%,var(--slab-lo) 100%),var(--slab-lo);
box-shadow:inset 0 -8px 15px -9px rgba(0,0,0,.8),
inset 0 9px 18px -12px rgba(200,170,230,.22)}
/* ONE gradient border: opaque rim colours, no border on the docked side.
   Eliminates the old 1.5px strip that doubled against the border at 125%. */
body.dock-bottom{border-radius:8px 8px 0 0;
border:1px solid transparent;border-bottom:0;
background:radial-gradient(135% 190% at 50% -35%,var(--slab-hi),var(--slab-mid) 44%,var(--slab-lo)) padding-box,
linear-gradient(0deg,var(--edge-lo),var(--edge-hi)) border-box}
body.dock-left{border-radius:0 8px 8px 0;
border:1px solid transparent;border-left:0;
background:radial-gradient(135% 190% at 50% -35%,var(--slab-hi),var(--slab-mid) 44%,var(--slab-lo)) padding-box,
linear-gradient(270deg,var(--edge-lo),var(--edge-hi)) border-box}
body.dock-right{border-radius:8px 0 0 8px;
border:1px solid transparent;border-right:0;
background:radial-gradient(135% 190% at 50% -35%,var(--slab-hi),var(--slab-mid) 44%,var(--slab-lo)) padding-box,
linear-gradient(90deg,var(--edge-lo),var(--edge-hi)) border-box}
/* Resting handle: smaller, softer — same gradient-border pattern, no 4-side ring */
body.tab{box-shadow:
inset 0 -3px 7px -5px rgba(0,0,0,.8),
inset 0 4px 9px -6px rgba(200,170,230,.22)}
body.tab.dock-bottom{border-radius:4px 4px 0 0;
border:1px solid transparent;border-bottom:0;
background:radial-gradient(135% 190% at 50% -35%,var(--slab-hi),var(--slab-mid) 44%,var(--slab-lo)) padding-box,
linear-gradient(0deg,rgba(247,244,236,.08),rgba(247,244,236,.18)) border-box}
body.tab.dock-left{border-radius:0 4px 4px 0;
border:1px solid transparent;border-left:0;
background:radial-gradient(135% 190% at 50% -35%,var(--slab-hi),var(--slab-mid) 44%,var(--slab-lo)) padding-box,
linear-gradient(270deg,rgba(247,244,236,.08),rgba(247,244,236,.18)) border-box}
body.tab.dock-right{border-radius:4px 0 0 4px;
border:1px solid transparent;border-right:0;
background:radial-gradient(135% 190% at 50% -35%,var(--slab-hi),var(--slab-mid) 44%,var(--slab-lo)) padding-box,
linear-gradient(90deg,rgba(247,244,236,.08),rgba(247,244,236,.18)) border-box}

/* ==== MOTION ============================================================
   No preserve-3d, no translateZ anywhere. */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
/* done receipt: enter from .9, not .72 — Emil says never from 0 */
@keyframes pop{from{transform:scale(.9)}to{transform:none}}
/* the filament breathing: 7.4s, shallow */
@keyframes filament{0%,100%{opacity:.84}50%{opacity:1}}
/* engine warming: shuttle via transform, not background-position */
@keyframes shuttleH{0%{transform:translateX(-100%)}100%{transform:translateX(238%)}}
@keyframes shuttleV{0%{transform:translateY(-100%)}100%{transform:translateY(238%)}}
@keyframes writeDot{0%,100%{opacity:.28;transform:none}
50%{opacity:1;transform:scale(1.35)}}
/* processing scan: transform sweep with rest at end */
@keyframes scanH{0%{transform:translateX(-100%)}72%,100%{transform:translateX(264%)}}
@keyframes scanV{0%{transform:translateY(-100%)}72%,100%{transform:translateY(264%)}}
@keyframes bloom{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
@keyframes recapCalm{to{opacity:.62}}
@keyframes failShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-3px)}
38%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
/* engine bar: transform sweep */
@keyframes engBarH{0%{transform:translateX(-100%)}72%,100%{transform:translateX(294%)}}

.layer{position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;gap:8px}

/* ==== 1. IDLE — the filament ===========================================
   A hairline of light seated in a machined groove. */
#core{position:relative;width:22px;height:3px;border-radius:999px;
--f1:rgba(108,85,232,.35);--f2:#9C86F6;--f3:#E6DCFF;
--fglow:rgba(156,134,246,.55);
/* the groove: dark slot with shaded top lip and catch-light below */
background:linear-gradient(180deg,#0A0709,#100C10 70%,#1A1518);
box-shadow:inset 0 1px 1px rgba(0,0,0,.95),
 0 1px 0 rgba(247,244,236,.07);
animation:fadeIn .4s ease-out both;
transition:transform .24s cubic-bezier(.2,.8,.3,1),filter .16s}
/* the light itself. ONE glow, not two stacked. */
#core::before{content:'';position:absolute;inset:0;border-radius:inherit;
pointer-events:none;
background:linear-gradient(90deg,var(--f1),var(--f2) 34%,var(--f3) 50%,var(--f2) 66%,var(--f1));
box-shadow:0 0 5px var(--fglow);
animation:filament 7.4s ease-in-out infinite;
transition:box-shadow .18s,opacity .18s}
/* the shuttle: transform-based, not background-position */
#core::after{content:'';position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;display:none;
pointer-events:none;will-change:transform;
background:linear-gradient(90deg,rgba(198,180,255,0),#C6B4FF 50%,rgba(198,180,255,0));
animation:shuttleH 1.5s ease-in-out infinite}
/* -- warming: filament goes dark and the shuttle runs it -- */
body.eng-warm #core::before{opacity:.14;animation:none;box-shadow:none}
body.eng-warm #core::after{display:block}
/* -- offline: the light is out, and it is out in red -- */
body.eng-fail #core{--f1:rgba(208,69,62,.2);--f2:rgba(208,69,62,.6);
--f3:rgba(208,69,62,.78);--fglow:rgba(208,69,62,.28)}
body.eng-fail #core::before{animation:none}
/* -- CPU: armed, but the light is cooler -- */
body.eng-cpu #core{--f1:rgba(140,130,182,.3);--f2:#B6ACDC;--f3:#EDE7FF;
--fglow:rgba(182,172,220,.45)}
/* hover stretch: scaleX instead of width */
body.tab:not(.vert):hover #core{transform:scaleX(1.27)}
body.tab.vert:hover #core{transform:scaleY(1.27)}
body.tab:hover #core{filter:brightness(1.3) saturate(1.08)}
body.tab:hover #core::before{box-shadow:0 0 6px rgba(178,158,255,.9)}
/* vertical groove */
body.vert #core{width:3px;height:22px;
background:linear-gradient(90deg,#0A0709,#100C10 70%,#1A1518);
box-shadow:inset 1px 0 1px rgba(0,0,0,.95),
 -1px 0 0 rgba(247,244,236,.07)}
body.vert #core::before{
background:linear-gradient(180deg,var(--f1),var(--f2) 34%,var(--f3) 50%,var(--f2) 66%,var(--f1))}
body.vert #core::after{inset:0 0 auto 0;width:auto;height:42%;
background:linear-gradient(180deg,rgba(198,180,255,0),#C6B4FF 50%,rgba(198,180,255,0));
animation:shuttleV 1.5s ease-in-out infinite}

/* ==== 2. RECORDING — the last two seconds, not the last frame ========== */
#rec-l{gap:8px;padding:0 9px}
/* Red once: wash OR teeth — not both plus ring plus clock glow.
   Keeping the wash, dropping the inset ring and clock shadow. */
#recwash{position:absolute;inset:0;border-radius:inherit;
background:radial-gradient(125% 160% at 50% 125%,rgba(208,69,62,.32),rgba(208,69,62,0) 72%);
opacity:calc(.26 + var(--lv) * .74);
transition:filter .28s}
body.rec:not(.hearing) #recwash{filter:saturate(.1) brightness(.85)}
body.vert #recwash{background:radial-gradient(160% 125% at 50% 100%,rgba(208,69,62,.32),rgba(208,69,62,0) 72%)}
/* the clock: no text-shadow (it blurs grayscale-AA 15px text) */
#t{font-family:'Segoe UI Variable Text','Segoe UI',sans-serif;
font-size:15px;font-weight:600;color:#FBF7EF;font-variant-numeric:tabular-nums;
letter-spacing:.005em;flex:none;
animation:rise .14s ease-out .1s both}
/* last-minute countdown: amber, not red */
body.ending #t{color:#F2B544}
/* the ribbon */
#wave{display:flex;align-items:center;justify-content:flex-end;gap:3px;flex:1;
min-width:0;height:22px;overflow:hidden;
background:linear-gradient(90deg,rgba(208,69,62,0),rgba(208,69,62,.32) 18%,
rgba(208,69,62,.32) 86%,rgba(208,69,62,0)) left center/100% 1px no-repeat;
-webkit-mask:linear-gradient(90deg,rgba(0,0,0,.12),#000 46%);
mask:linear-gradient(90deg,rgba(0,0,0,.12),#000 46%);
animation:fadeIn .16s ease-out .14s both;transition:filter .28s}
body.rec:not(.hearing) #wave{filter:saturate(.06)}
#wave-track{display:flex;align-items:center;gap:3px;flex:none;
will-change:transform}
/* tooth colour in variables for mode re-tinting */
#rec-l{--t1:#FFCFC2;--t2:#E85A4C;--t3:#C03830;--tg:rgba(232,90,76,.5)}
#wave i{width:2px;height:20px;border-radius:999px;display:block;flex:none;
transform:scaleY(.1);
background:linear-gradient(180deg,var(--t1),var(--t2) 46%,var(--t3));
box-shadow:0 0 6px var(--tg);
transition:background .2s,box-shadow .2s}
#wave i.q{background:#5F5880;box-shadow:none}
/* too loud: amber, not red */
#wave i.hot{background:linear-gradient(180deg,#FFE7AE,#F2B544 46%,#D98E16);
box-shadow:0 0 6px rgba(242,181,68,.6)}

/* ==== 3. PROCESSING — one beat, not a state ============================
   Transform-based sweep with rest at 72-100% of the cycle. */
#proc-l{gap:10px;padding:0 10px;overflow:hidden}
#proc-l::before{content:'';position:absolute;inset:0 auto 0 0;width:38%;pointer-events:none;
will-change:transform;
background:linear-gradient(90deg,rgba(156,134,246,0),rgba(156,134,246,.3) 45%,
rgba(198,180,255,.42) 50%,rgba(156,134,246,.3) 55%,rgba(156,134,246,0));
animation:scanH 1.6s cubic-bezier(.4,0,.3,1) infinite}
body.vert #proc-l::before{inset:0 0 auto 0;width:auto;height:38%;
background:linear-gradient(180deg,rgba(156,134,246,0),rgba(156,134,246,.3) 45%,
rgba(198,180,255,.42) 50%,rgba(156,134,246,.3) 55%,rgba(156,134,246,0));
animation:scanV 1.6s cubic-bezier(.4,0,.3,1) infinite}
.pwork{display:flex;align-items:center;gap:9px;position:relative;
animation:rise .16s ease-out both}
#pdots{display:flex;align-items:center;gap:4px}
#pdots i{width:5px;height:5px;border-radius:999px;display:block;flex:none;
background:linear-gradient(180deg,var(--vio3),var(--vio2));
box-shadow:0 0 6px rgba(156,134,246,.6);animation:writeDot 1.05s ease-in-out infinite}
#pdots i:nth-child(2){animation-delay:.14s}
#pdots i:nth-child(3){animation-delay:.28s}
.ptime{font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:10px;font-weight:600;letter-spacing:.05em;color:#A79CD2;
font-variant-numeric:tabular-nums}

/* ==== 4. DONE — the receipt ============================================ */
#recap{display:none;align-items:baseline;justify-content:center;gap:5px;
position:relative;animation:pop .18s cubic-bezier(.2,1.3,.4,1) both,
recapCalm .5s ease 1.4s both}
#rc-n{font-family:'Segoe UI Variable Text','Segoe UI',sans-serif;
font-size:18px;font-weight:600;color:#F4EFFF;line-height:1;
letter-spacing:-.02em;font-variant-numeric:tabular-nums;
text-shadow:0 0 14px rgba(180,158,255,.5)}
#rc-u{font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
color:#9E93CC}
#rc-w{font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:11px;font-style:normal;font-weight:600;color:#C6B4FF;
font-variant-numeric:tabular-nums;letter-spacing:.01em}
#recap.bare #rc-n{font-size:13px;letter-spacing:0}
#recap.bare #rc-u,#recap.bare #rc-w{display:none}
#flashrim{position:absolute;inset:0;border-radius:inherit;
box-shadow:inset 0 0 0 1px rgba(214,201,255,.7),inset 0 0 22px rgba(156,134,246,.4);
animation:bloom 1s ease-out both}

/* ==== 5. FAILURE ======================================================= */
#failwash{position:absolute;inset:0;border-radius:inherit;
background:radial-gradient(125% 165% at 50% 125%,rgba(208,69,62,.3),rgba(208,69,62,.04) 74%);
box-shadow:inset 0 0 0 1px rgba(208,69,62,.55)}
#fail-l{gap:8px;padding:0 11px;cursor:pointer;animation:failShake .36s ease-out both}
#fail-l svg{flex:none;filter:drop-shadow(0 0 6px rgba(208,69,62,.65))}
#fail-l b{font-family:'Segoe UI Variable Text','Segoe UI',sans-serif;
font-size:11.5px;font-weight:600;color:#FFB5AA;white-space:nowrap;
min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ==== 6. HOVER — 190x46, horizontal on every dock ======================
   Buttons radius 6 so they nest in the 46px bar. */
#hov-l{gap:5px;padding:0 8px;cursor:grab}
#hov-l:active{cursor:grabbing}
#grip{width:8px;height:18px;flex:none;margin-right:1px;opacity:.5;
background:radial-gradient(circle at 1.5px 1.5px,rgba(207,198,245,.9) 1px,transparent 1.35px);
background-size:4px 4px;transition:opacity .14s}
#hov-l:hover #grip{opacity:.85}
.htxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;
justify-content:center;overflow:hidden}
#hov-t{font-family:'Segoe UI Variable Text','Segoe UI',sans-serif;
font-size:12px;font-weight:600;color:#F4EEE1;line-height:1.15;
font-variant-numeric:tabular-nums;letter-spacing:.005em;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#hov-s{font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
color:#9186BE;line-height:1.15;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;text-align:left}
#hov-s:empty{display:none}
.pbtn{position:relative;width:26px;height:26px;flex:none;border:0;border-radius:6px;
cursor:pointer;padding:0;color:#EFE9DC;display:flex;align-items:center;
justify-content:center;font:inherit;
background:linear-gradient(180deg,rgba(247,244,236,.16),rgba(247,244,236,.05));
box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 0 0 1px rgba(247,244,236,.07);
transition:background .14s,color .14s,transform .1s,box-shadow .14s}
.pbtn::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(90deg,rgba(255,255,255,0) 12%,rgba(255,255,255,.5) 50%,
rgba(255,255,255,0) 88%) top left/100% 1px no-repeat}
.pbtn svg{position:relative}
.pbtn:hover{background:linear-gradient(180deg,rgba(156,134,246,.55),rgba(108,85,232,.34));color:#FFF}
.pbtn:active{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.pbtn:focus-visible{outline:2px solid #9C86F6;outline-offset:1px}
.pbtn.warn{color:#FFC6BD;
background:linear-gradient(180deg,rgba(208,69,62,.36),rgba(168,45,38,.16));
box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 0 0 1px rgba(208,69,62,.36)}
.pbtn.warn:hover{background:linear-gradient(180deg,rgba(208,69,62,.75),rgba(168,45,38,.5));color:#FFF1EE}
#btn-panel-close{width:20px;height:20px;border-radius:6px}

/* ==== 7. PANEL — 232x150 =============================================== */
#panel-l{flex-direction:column;align-items:stretch;gap:5px;padding:6px 10px;
justify-content:flex-start}
#panel-l .ph{display:flex;align-items:center;gap:8px;height:20px;flex:none;cursor:grab;
background:linear-gradient(90deg,rgba(247,244,236,.18),rgba(247,244,236,.02)) bottom left/100% 1px no-repeat}
#panel-l .ph b{flex:1;min-width:0;font-family:'Segoe UI Variable Text','Segoe UI',sans-serif;
font-size:12px;font-weight:600;color:#F4EEE1;
font-variant-numeric:tabular-nums;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* engine row */
#eng{display:flex;align-items:center;gap:7px;height:22px;flex:none;padding:0 8px;
border-radius:7px;position:relative;overflow:hidden;
background:linear-gradient(180deg,rgba(247,244,236,.07),rgba(247,244,236,.02));
box-shadow:inset 0 0 0 1px rgba(247,244,236,.06)}
#eng-dot{width:6px;height:6px;border-radius:999px;flex:none;display:block;
background:linear-gradient(180deg,var(--vio3),var(--vio));
box-shadow:0 0 6px rgba(156,134,246,.75)}
body.eng-warm #eng-dot{background:#6E6690;box-shadow:none}
body.eng-fail #eng-dot{background:var(--red);box-shadow:0 0 6px rgba(208,69,62,.7)}
body.eng-cpu #eng-dot{background:linear-gradient(180deg,#D9D2F2,#8C82B6);box-shadow:none}
#eng-t{flex:1;min-width:0;font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:10px;font-weight:600;letter-spacing:.06em;
text-transform:uppercase;color:#B7ADDE;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
/* engine bar: transform-based sweep */
#eng-bar{display:none;position:absolute;left:0;bottom:0;width:34%;height:2px;
will-change:transform;
background:linear-gradient(90deg,rgba(108,85,232,0),#9C86F6 50%,rgba(108,85,232,0));
animation:engBarH 1.4s ease-in-out infinite}
body.eng-warm #eng-bar{display:block}
/* stats */
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:none}
.pstat{display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2px;height:32px;border-radius:7px;
background:linear-gradient(180deg,rgba(247,244,236,.07),rgba(247,244,236,.02));
box-shadow:inset 0 0 0 1px rgba(247,244,236,.06)}
.pstat b{font-family:'Segoe UI Variable Text','Segoe UI',sans-serif;
font-size:13px;font-weight:600;color:#EFE7D8;letter-spacing:-.01em;
font-variant-numeric:tabular-nums;line-height:1}
.pstat span{font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:8px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
color:#8C82B6;line-height:1}
body.rec #ps-turn{color:#FFC2B7}
#panel-l .plab{font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:9px;font-weight:700;letter-spacing:.11em;
text-transform:uppercase;color:#8C82B6;flex:none}
#panel-l #panel-hint{text-transform:none;letter-spacing:.01em;
font-family:'Segoe UI Variable Small','Segoe UI',sans-serif;
font-size:10px;font-weight:500;color:#968CC2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
text-align:center;height:12px;line-height:12px}
/* dock picker */
#dock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
#dock button{position:relative;height:29px;padding:0;cursor:pointer;overflow:hidden;
border:1px solid rgba(247,244,236,.10);border-radius:8px;
background:linear-gradient(180deg,rgba(247,244,236,.07),rgba(247,244,236,.02));
box-shadow:inset 0 0 12px rgba(0,0,0,.4);
transition:background .14s,border-color .14s,box-shadow .14s}
#dock button::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(90deg,rgba(255,255,255,0) 14%,rgba(255,255,255,.32) 50%,
rgba(255,255,255,0) 86%) top left/100% 1px no-repeat}
#dock button:hover{background:linear-gradient(180deg,rgba(156,134,246,.24),rgba(108,85,232,.10));
border-color:rgba(156,134,246,.5)}
#dock button.on{background:linear-gradient(180deg,rgba(156,134,246,.32),rgba(108,85,232,.14));
border-color:#9C86F6;box-shadow:inset 0 0 12px rgba(108,85,232,.4)}
#dock button:focus-visible{outline:2px solid #9C86F6;outline-offset:1px}
#dock button i{display:block;position:absolute;background:linear-gradient(90deg,#6C55E8,#C6B4FF);
transition:box-shadow .14s}
#dock button.on i{box-shadow:0 0 8px rgba(156,134,246,.95)}
#dock button[data-p=bottom] i{width:18px;height:5px;left:50%;transform:translateX(-50%);
bottom:0;border-radius:3px 3px 0 0}
#dock button[data-p=left] i,#dock button[data-p=right] i{width:5px;height:16px;top:50%;
transform:translateY(-50%);background:linear-gradient(180deg,#6C55E8,#C6B4FF)}
#dock button[data-p=left] i{left:0;border-radius:0 3px 3px 0}
#dock button[data-p=right] i{right:0;border-radius:3px 0 0 3px}

/* ==== 8. VERTICAL — an upright composition, not a rotation ============= */
body.vert #rec-l{flex-direction:column-reverse;gap:6px;padding:8px 0}
body.vert #wave{flex-direction:column;width:26px;height:auto;flex:1;min-height:0;
background:linear-gradient(180deg,rgba(208,69,62,0),rgba(208,69,62,.32) 18%,
rgba(208,69,62,.32) 86%,rgba(208,69,62,0)) center top/1px 100% no-repeat;

const micFlashEl=document.getElementById('micflash');
const micFlashSpan=document.createElement('span');micFlashEl.appendChild(micFlashSpan);
const undoBar=document.getElementById('undo-bar');

function pyapi(fn){
 if(window.pywebview&&window.pywebview.api&&window.pywebview.api[fn])
  window.pywebview.api[fn]();
}
let RECKEY='F9';
function fmt(s){s=Math.max(0,Math.floor(s));
 return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function secs(ms){const s=ms/1000;return s<10?s.toFixed(1)+'s':Math.round(s)+'s';}
function elapsed(){return startedAt?Math.max(0,Date.now()/1000-startedAt):0;}
function engReady(){return engStatus==='ready'||engStatus==='idle';}
function engWarm(){return engStatus==='downloading'||engStatus==='loading';}
function isFlash(){return base.indexOf('flash')>=0;}
function escArmed(){return performance.now()<escUntil;}
function micFlash(){return performance.now()<micUntil;}
function morphing(){return performance.now()<morphUntil;}
/* the clock counts DOWN for the last minute before the length cap */
function remaining(){return capS?capS-elapsed():Infinity;}
function clockText(){const r=remaining();return r<=60?fmt(r)+' left':fmt(elapsed());}
/* what the engine is, in the four words the panel row has space for */
function device(){
 if(engMode==='cloud')return'Cloud engine';
 if(engDev==='cuda')return'Local · GPU';
 if(engDev==='cpu')return'Local · CPU';
 return'Local engine';
}
function where(){
 return takeMode==='note'?'Notebook':takeMode==='command'?'Edit':
  takeMode==='refine'?'Refine':'';
}
/* the one status string, in two registers: headline and sub-line. Both
   readouts and the panel title carry it, so there is one source of truth
   about what this thing is doing. */
function label(){
 if(base==='rec'){
  const w=where();
  /* "Notebook · Esc cancels" ellipsised in the 190x46 hover. Where the take
     goes is the thing worth the room; the cancel button is right beside it */
  const sub=!hearing?'No sound':escArmed()?'Esc again to discard':
   (w||'Esc cancels');
  return['Rec '+clockText(),sub];
 }
 if(base==='cancelled')return['Cancelled','Undo to finish it'];
 if(isFlash()){
  if(lastBlind)return['Copied','Ctrl+V to paste'];
  return[lastWords?lastWords+' words':'Done',lastWpm?lastWpm+' wpm':''];
 }
 if(base==='processing')return['Writing…',device()];
 if(base==='failed')return['Transcription failed',''];
 if(engStatus==='downloading')
  return['Getting model…',engAt?fmt((Date.now()-engAt)/1000)+' so far':'first run'];
 if(engStatus==='loading')return['Warming engine…',device()];
 if(engStatus==='failed')return['Engine offline','Click to open'];
 return['Ready · '+RECKEY,engDev==='cpu'?'CPU · slower':device()];
}
/* cached so nothing writes textContent on four nodes for no change */
let lastTxt='';
function say(){
 const p=label(),k=p[0]+' '+p[1];
 if(k===lastTxt)return;
 lastTxt=k;
 elHov.textContent=p[0];elHovS.textContent=p[1];elPanelT.textContent=p[0];
}
function paint(){
 /* panel outranks hover, hover overlays the working state, and failure
    outranks hover so a failed take is never hidden by the cursor.
    `tab` is the resting handle look — only when idle AND untouched. */
 const hov=hovering&&base!=='failed'&&base!=='cancelled'&&!panelOpen;
 /* `vert` stays ON while hovering. Python sizes the hovered window to
    VHOVER 54x178 on a side dock — it CANNOT be the wide 190x46 box,
    because a hover box has to contain the 38x150 bar it grew from on both
    axes or the window edge sweeps past the cursor and enter/leave loops
    forever. So the upright dock gets an upright control stack. Only the
    panel is horizontal on every dock, because 232x150 always is. */
 if(base!=='rec'){hearing=false;disp=0;root.style.setProperty('--lv',0);}
 const rec=base==='rec';
 document.body.className=base
  +(panelOpen?' panel':(hov?' hov':''))
  +((vertical&&!panelOpen)?' vert':'')
  +((base==='mini'&&!panelOpen&&!hov)?' tab':'')
  +(hearing?' hearing':'')
  +(moving?' moving':'')
  +(engWarm()?' eng-warm':'')
  +(engStatus==='failed'?' eng-fail':'')
  +((engStatus==='ready'&&engDev==='cpu')?' eng-cpu':'')
  +(rec&&takeMode!=='dictate'?' take-'+takeMode:'')
  +(rec&&escArmed()?' esc-armed':'')
  +(rec&&micFlash()?' mic-flash':'')
  +(rec&&ending?' ending':'')
  +(morphing()?' morph':'')
  +(isFlash()&&lastBlind?' blind':'')
  +(isLight?' light':'')
  +(document.hidden?' asleep':'')
  +' dock-'+dock;
 lastTxt='';say();
 document.getElementById('btn-cancel').style.display=busy?'flex':'none';
 /* idle hover offers the last take again instead of Cancel - same slot, so
    the hover bar never changes width */
 document.getElementById('btn-copy').style.display=
  (!busy&&hasLast&&base!=='cancelled')?'flex':'none';
 stats();
 kick();
}
function stats(){
 document.getElementById('ps-takes').textContent=takes;
 document.getElementById('ps-len').textContent=words;
 const live=base==='rec';
 /* while he is still talking, wpm does not exist yet — the cell shows the
    clock instead rather than a stale number from the previous take */
 document.getElementById('ps-turn-l').textContent=live?'Elapsed':'Wpm';
 document.getElementById('ps-turn').textContent=
  live?fmt(elapsed()):(lastWpm?lastWpm:'—');
 elEngT.textContent=
  engStatus==='downloading'?'Downloading model'+(engAt?' · '+fmt((Date.now()-engAt)/1000):''):
  engStatus==='loading'?'Loading model':
  engStatus==='failed'?'Engine unavailable':device();
 elMic.textContent=micName;
 elMic.title=micName?'Microphone: '+micName:'';
 /* the hint line is the only surface with room for words, so it is where
    the shortcuts get taught — and where a stalled first run gets explained */
 document.getElementById('panel-hint').textContent=
  busy?'Right-click or Esc to cancel':
  engWarm()?'Dictation starts once the model is ready':
  RECKEY+' to dictate · double-click to move';
}
function setDock(p){
 dock=p;
 vertical=(p==='left'||p==='right');
 document.querySelectorAll('#dock button').forEach(
  b=>b.classList.toggle('on',b.dataset.p===p));
 paint();
}
function setPanel(on){
 panelOpen=on;
 if(on)hovering=false;
 paint();
 if(window.pywebview&&window.pywebview.api&&window.pywebview.api.pill_panel)
  window.pywebview.api.pill_panel(on);
}
function resetWave(){
 for(let i=0;i<=NB;i++){hist[i]=0;quietRaw[i]=true;hot[i]=false;}
 shiftAt=0;settle=0;
}
function renderRecap(){
 /* the paste went nowhere (desktop or taskbar had focus): the receipt
    becomes an instruction, since a word count would be a lie about where
    the text went */
 if(lastBlind){
  recap.classList.add('bare');
  rcN.textContent='Copied · Ctrl+V';rcW.textContent='';return;
 }
 const has=lastWords>0;
 recap.classList.toggle('bare',!has);
 rcN.textContent=has?String(lastWords):'Done';
 rcW.textContent=lastWpm?lastWpm+' wpm':'';
}
window.app={
 /* take = {mode, cap, mic}. Older engines send no second argument. */
 start(ts,take){
  take=take||{};
  startedAt=ts;lvl=0;disp=0;hearing=false;clip=false;ending=false;
  escUntil=0;morphUntil=0;resetWave();
  takeMode=take.mode||'dictate';capS=take.cap||0;
  const m=take.mic||'';
  /* flash the mic only when it CHANGED since the last take - a headset
     plugged in moves the Windows default under you, silently */
  micUntil=(m&&lastMic&&m!==lastMic)?performance.now()+1500:0;
  if(micUntil){micFlashSpan.textContent=m;setTimeout(paint,1520);}
  if(m){micName=m;lastMic=m;}
  base='rec';busy=true;paint();},
 level(v,c){lvl=v;clip=!!c;},
 /* '' is a REAL state — the blank frame held while the window resizes.
    Coercing it to mini painted the idle filament at full expanded width
    for the whole collapse. */
 mode(m){const next=(m===undefined||m===null)?'mini':m;
  if(next==='processing'&&base!=='processing'){
   takeLen=elapsed()||6;procAt=Date.now();
   /* the same wave carries straight on into processing and settles there,
      starting from wherever the voice left it */
   settle=disp;
  }
  base=next;busy=(m==='processing');paint();},
 /* summary = {words, secs, wpm, cleaned, blind} or null. `cleaned` is not
    shown: nothing on this page can honestly say what it means yet. */
 done(sum){
  takes++;
  lastBlind=!!(sum&&sum.blind);
  if(sum&&sum.words){
   lastWords=sum.words|0;words+=lastWords;hasLast=true;
   lastWpm=Math.round(sum.wpm||(sum.secs?sum.words/(sum.secs/60):0))||0;
  }else{lastWords=0;lastWpm=0;}
  renderRecap();
  base='processing flash';busy=false;paint();},
 failed(msg){base='failed';busy=false;
  if(msg)document.getElementById('fail-t').textContent=msg;
  paint();},
 /* a long take got ONE Esc: say what a second one does, then stand down */
 escArmed(ms){escUntil=performance.now()+(ms||2000);paint();
  setTimeout(paint,(ms||2000)+30);},
 /* a take was just cancelled and can still be finished */
 cancelled(ms){
  undoBar.style.animationDuration=(ms||10000)+'ms';
  base='cancelled';busy=false;hovering=false;paint();},
 mic(name){micName=name||'';if(micName)lastMic=micName;stats();},
 theme(dark){isLight=!dark;paint();},
 reckey(k){RECKEY=(k||'f9').toUpperCase();paint();},
 pos(p){setDock(p);},
 vert(on){vertical=!!on;paint();},
 /* the trip between docks: contents fade out, a quiet slab slides along
    the screen edge, contents fade back in at the new orientation */
 moving(on){moving=!!on;paint();},
 /* info = {mode, status, device}. Only status words ever arrive, so the
    download's own elapsed time is clocked here to give it a felt length. */
 engine(info){
  info=info||{};
  engMode=info.mode||engMode;
  engStatus=info.status||'idle';
  engDev=(info.device===undefined?engDev:info.device)||'';
  if(engStatus==='downloading'){if(!engAt)engAt=Date.now();}else engAt=0;
  paint();}
};
const body=document.body;
body.addEventListener('mouseenter',()=>{
 if(base==='failed'||base==='cancelled'||panelOpen||moving)return;
 hovering=true;pyapi('pill_hover_in');paint();});
body.addEventListener('mouseleave',()=>{
 if(panelOpen||dragging)return;
 hovering=false;pyapi('pill_hover_out');paint();});
document.getElementById('btn-cancel').addEventListener('click',e=>{
 e.stopPropagation();pyapi('pill_cancel');});
document.getElementById('btn-open').addEventListener('click',e=>{
 e.stopPropagation();pyapi('pill_open');});
document.getElementById('btn-copy').addEventListener('click',e=>{
 e.stopPropagation();pyapi('pill_copy_last');
 const b=e.currentTarget;b.classList.add('done');
 setTimeout(()=>b.classList.remove('done'),900);});
document.getElementById('btn-undo').addEventListener('click',e=>{
 e.stopPropagation();pyapi('pill_undo');});
document.getElementById('btn-snooze').addEventListener('click',e=>{
 e.stopPropagation();
 /* Python closes the panel and hides the window itself; calling pill_panel
    here as well would race it into resizing a window that is going away */
 panelOpen=false;hovering=false;paint();pyapi('pill_snooze');});
document.getElementById('btn-panel').addEventListener('click',e=>{
 e.stopPropagation();setPanel(true);});
document.getElementById('btn-panel-close').addEventListener('click',e=>{
 e.stopPropagation();setPanel(false);});
function setPos(p){
 if(window.pywebview&&window.pywebview.api&&window.pywebview.api.pill_set_pos)
  window.pywebview.api.pill_set_pos(p);
}
document.getElementById('dock').addEventListener('click',e=>{
 const b=e.target.closest('button[data-p]');if(!b)return;
 e.stopPropagation();
 document.querySelectorAll('#dock button').forEach(
  x=>x.classList.toggle('on',x===b));
 setPos(b.dataset.p);});
document.getElementById('fail-l').addEventListener('click',()=>{
 base='mini';paint();pyapi('pill_open');});
/* ---- the two things he does most, one gesture each ----------------------
   Move it out of the way: double-click cycles the dock, so "get off this
   corner" costs one gesture instead of hover, panel, tile.
   Kill a bad take: right-click anywhere on the slab, or Esc — no hunting
   for a 26px button mid-sentence. Both route through bridge calls that
   already exist. */
body.addEventListener('dblclick',e=>{
 if(base==='failed'||base==='cancelled'||e.target.closest('.pbtn')||
    e.target.closest('.tbtn')||e.target.closest('#dock'))return;
 setPos({bottom:'right',right:'left',left:'bottom'}[dock]||'bottom');});
body.addEventListener('contextmenu',e=>{
 e.preventDefault();
 if(busy){pyapi('pill_cancel');return;}
 setPanel(!panelOpen);});
window.addEventListener('keydown',e=>{
 if(e.key!=='Escape')return;
 if(panelOpen){setPanel(false);return;}
 if(busy)pyapi('pill_cancel');});
/* hidden page (snoozed, stepped aside): paint() adds `asleep`, which pauses
   every CSS animation; the frame loop stops on its own via kick() */
document.addEventListener('visibilitychange',paint);

/* ---- drag ----
   WM_NCLBUTTONDOWN cannot work from the JS bridge thread (ReleaseCapture is
   per-thread, so WebView2 kept the pointer capture and every drop snapped
   back). Pointer events plus explicit moves are boring and reliable. */
function startDrag(ev){
 if(ev.button!==0||ev.target.closest('.pbtn')||ev.target.closest('#dock'))return;
 ev.preventDefault();
 const sx=ev.screenX,sy=ev.screenY;
 let pending=null,raf=0;
 dragging=true;
 const api=(window.pywebview||{}).api;
 if(!api||!api.pill_drag_start)return;
 api.pill_drag_start();
 const move=e=>{
  pending=[e.screenX-sx,e.screenY-sy];
  if(raf)return;
  raf=requestAnimationFrame(()=>{raf=0;
   if(pending&&api.pill_drag_move)api.pill_drag_move(pending[0],pending[1]);});
 };
 const up=()=>{
  window.removeEventListener('pointermove',move);
  window.removeEventListener('pointerup',up);
  if(raf)cancelAnimationFrame(raf);
  dragging=false;
  if(api.pill_drag_end)api.pill_drag_end();
 };
 window.addEventListener('pointermove',move);
 window.addEventListener('pointerup',up);
}
document.getElementById('hov-l').addEventListener('pointerdown',startDrag);
document.querySelector('#panel-l .ph').addEventListener('pointerdown',startDrag);

/* ---- the wave ----
   Three strands of sine, each filled as a band mirrored about the spine and
   added together ('lighter'), so where they cross they brighten - the
   braided, living look of a voice assistant's wave. Their height along the
   length is the loudness history; they drift through it faster when he is
   louder. A faint spine is always drawn, so silence reads as a LINE, not as
   the bar going blank. Palettes: [bright core, body, deep edge]. */
const PAL={
 dictate:['#FFE4DC','#FF7A64','#D0453E'],
 note:['#F2ECFF','#A994FA','#6C55E8'],
 hot:['#FFF2CC','#F5B642','#D98E16'],
 settle:['#EEE8FF','#9C86F6','#6C55E8'],
 quiet:['#C2BAD3','#857C9C','#5D5672']};
/* k = cycles along the length, s = drift speed and direction, w = height,
   a = fill opacity. Different k and opposite drifts keep the braid from ever
   visibly repeating. */
const STRANDS=[{k:1.25,s:1.0,w:1.0,a:.36},{k:2.05,s:-1.35,w:.8,a:.26},
 {k:3.1,s:1.8,w:.58,a:.2}];
function rgba(h,a){const n=parseInt(h.slice(1),16);
 return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
const amp=new Float32Array(257);
/* f = how far we are between two history samples (0..1): the loudness
   envelope drifts toward the old end continuously instead of stepping every
   130ms, and re-indexes seamlessly on each new sample. live=false is the
   processing beat: no history, one gentle settling amplitude. */
function drawFlow(dt,f,live){
 if(!cw||!ch)fitCanvas();
 if(!cw||!ch)return;
 wtime+=dt;
 const loud=live?disp:settle;
 if(!reduced)phase+=dt*(live?1.7+5*loud:.9);
 const L=vertical?ch:cw, half=(vertical?cw:ch)/2, maxA=half-2*dpr;
 let hotNow=false;
 if(live)for(let i=NB-4;i<=NB;i++)if(hot[i])hotNow=true;
 const pal=!live?PAL.settle:hotNow?PAL.hot:!hearing?PAL.quiet:
  takeMode==='note'?PAL.note:PAL.dictate;
 const N=Math.min(256,Math.max(24,Math.round(L/(3*dpr))));
 for(let i=0;i<=N;i++){
  const u=i/N;let a;
  if(live){
   const s=u*NB-(1-f);
   const i0=Math.max(0,Math.min(NB,Math.floor(s))),i1=Math.min(NB,i0+1);
   const t=s-Math.floor(s);
   a=s<0?hist[0]:hist[i0]*(1-t)+hist[i1]*t;
  }else a=loud;
  /* both ends pinch into the spine, and the live end carries more weight
     than the fading past */
  const env=Math.pow(Math.sin(Math.PI*u),.75)*(.35+.65*u);
  /* square-root lift: his mic is QUIET, and on a linear scale ordinary
     speech barely lifted the wave off the spine */
  amp[i]=Math.max(.03,Math.min(1,Math.sqrt(a)*1.25))*env*maxA;
 }
 const mid=half;
 const P=vertical?(al,off)=>cx.lineTo(mid+off,al):(al,off)=>cx.lineTo(al,mid+off);
 const M=vertical?(al,off)=>cx.moveTo(mid+off,al):(al,off)=>cx.moveTo(al,mid+off);
 cx.clearRect(0,0,cw,ch);
 cx.globalCompositeOperation='lighter';
 for(let si=STRANDS.length-1;si>=0;si--){
  const st=STRANDS[si];
  cx.beginPath();
  for(let i=0;i<=N;i++){const u=i/N;
   const v=amp[i]*st.w*Math.sin(6.2832*st.k*u+phase*st.s);
   i?P(u*L,v):M(u*L,v);}
  for(let i=N;i>=0;i--){const u=i/N;
   P(u*L,-amp[i]*st.w*Math.sin(6.2832*st.k*u+phase*st.s));}
  cx.closePath();
  cx.fillStyle=rgba(pal[2],st.a);cx.fill();
 }
 cx.globalCompositeOperation='source-over';
 cx.lineCap='round';
 /* the spine */
 cx.beginPath();M(2*dpr,0);P(L-2*dpr,0);
 cx.lineWidth=dpr;cx.strokeStyle=rgba(pal[1],.3);cx.stroke();
 /* two lit edges on top of the bands - in the wave's own colour, not white:
    a near-white line read as "a line with a bump", not as a voice. In
    silence they dim, so a pause is a calm line rather than a bright one. */
 cx.globalCompositeOperation='lighter';
 const dim=(live&&!hearing)?.5:1;
 for(const [si,col,al,w] of [[1,pal[2],.75*dim,1.2],[0,pal[1],.95*dim,1.6]]){
  const st=STRANDS[si];
  cx.beginPath();
  for(let i=0;i<=N;i++){const u=i/N;
   const v=amp[i]*st.w*Math.sin(6.2832*st.k*u+phase*st.s);
   i?P(u*L,v):M(u*L,v);}
  cx.lineWidth=w*dpr;cx.strokeStyle=rgba(col,al);cx.stroke();
 }
 cx.globalCompositeOperation='source-over';
}

/* ---- the frame loop ----
   It used to run 60+ times a second ALL DAY, idle included. It now runs
   only while something on screen is actually moving, and stops itself the
   moment nothing is. The idle filament's breathing is a CSS animation and
   never needed a frame loop at all. */
let rafOn=false,lastT=0,lastClock='',lastPtime='';
function needsFrames(){
 if(document.hidden)return false;
 return base==='rec'||(base==='processing'&&!isFlash())||
  ((hovering||panelOpen)&&engStatus==='downloading');
}
function kick(){
 if(rafOn||!needsFrames())return;
 rafOn=true;lastT=0;requestAnimationFrame(frame);
}
function frame(now){
 if(!needsFrames()){rafOn=false;return;}
 /* frame-rate independent: the old per-frame 0.5 / 0.12 factors made the
    release twice as fast on a 144Hz screen as on a 60Hz one */
 const dt=lastT?Math.min(.1,(now-lastT)/1000):1/60;lastT=now;
 if(base==='rec'){
  const c=clockText();
  if(c!==lastClock){lastClock=c;elT.textContent=c;}
  const end=remaining()<=60;
  if(end!==ending){ending=end;paint();}
  /* `lvl` already arrives as a perceptual 0..1, auto-ranged to this
     microphone by the engine. It used to be raw RMS scaled by 9 here — on
     a quiet mic that put every voiced block under the gate and the bar
     showed silence the whole time he spoke. Do not reintroduce a
     multiplier.
     Attack ~20ms, release ~200ms: a meter that jumps up with a syllable and
     eases down, the way broadcast level meters behave. */
  const target=Math.max(0,Math.min(1,lvl));
  const tau=target>disp?.02:.2;
  disp+=(target-disp)*(1-Math.exp(-dt/tau));
  root.style.setProperty('--lv',disp.toFixed(3));
  /* hysteresis, so a voice sitting on the threshold cannot strobe the whole
     slab between its heard and unheard looks */
  const cl=document.body.classList;
  if(hearing?disp<0.06:disp>0.12){hearing=!hearing;cl.toggle('hearing',hearing);}
  /* shiftAt advances by exactly SHIFT, so sample timing never drifts; after
     a stall it catches up rather than bunching samples together */
  if(!shiftAt)shiftAt=now;
  let guard=0;
  while(now-shiftAt>=SHIFT&&guard++<NB+1){
   shiftAt+=SHIFT;
   hist.shift();hist.push(disp);
   quietRaw.shift();quietRaw.push(disp<0.08);
   hot.shift();hot.push(false);
  }
  if(now-shiftAt>=SHIFT)shiftAt=now;
  /* the leading sample stays live between shifts, so the ribbon is a
     history that still moves with his voice rather than a slideshow */
  hist[NB]=disp;quietRaw[NB]=disp<0.08;
  if(clip)hot[NB]=true;             // latched for the life of the sample
  drawFlow(dt,Math.min(1,(now-shiftAt)/SHIFT),true);
  if(panelOpen)stats();
  if(hovering||panelOpen)say();
 }else if(base==='processing'){
  const p=secs(Date.now()-procAt);
  if(p!==lastPtime){lastPtime=p;elPtime.textContent=p;elT.textContent=p;}
  /* the wave slows and settles to a gentle breath while the text is written */
  const target=.2+.07*Math.sin(wtime*1.6);
  settle+=(target-settle)*(1-Math.exp(-dt/.55));
  drawFlow(dt,0,false);
 }else if(engStatus==='downloading'){
  say();if(panelOpen)stats();
 }
 requestAnimationFrame(frame);
}
kick();
/* Ask Python for our state rather than waiting to be told. Its startup
   pushes (dock, hotkey, engine) fire on a timer a second or two after boot
   and are silently dropped if this page has not finished loading — which is
   what a cold start of the onefile build actually does, leaving the bar
   claiming the engine was ready while it was still loading the model.
   pywebview injects the api asynchronously, so poll briefly for it instead
   of assuming it exists on first paint. */
(function ask(n){
 const api=(window.pywebview||{}).api;
 if(api&&api.pill_ready){api.pill_ready();return;}
 if(n<80)setTimeout(()=>ask(n+1),100);
})(0);
</script></body></html>
